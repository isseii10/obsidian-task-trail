name: Test

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # Node from mise.toml (the same version Obsidian uses)
      - uses: jdx/mise-action@v5

      - run: npm ci
      - run: node --check main.js
      - run: npm run typecheck
      - run: npm test

      # A release is made from a tag named after manifest.json's version (see README), so they must match
      - name: Check manifest version matches the tag
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          version=$(node -p "require('./manifest.json').version")
          if [ "$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::manifest.json version $version does not match tag $GITHUB_REF_NAME"
            exit 1
          fi
