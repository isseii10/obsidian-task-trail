name: Test

on:
  push:
  pull_request:

permissions:
  contents: read

# Actions are pinned to commit SHAs, not tags: a tag can be moved, and the release job can publish and sign
# what users install. Dependabot (.github/dependabot.yml) updates the SHAs and the version comments
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Node from mise.toml (the same version Obsidian uses). Not actions/setup-node, which cannot read mise.toml
      - uses: jdx/mise-action@924e7c586e33d7d4bae9c14e26c5d22e2beb6e78 # v5.3.0

      - run: npm ci
      - run: node --check main.js
      - run: npm run typecheck
      - run: npm test

      # A release is made from a tag named after manifest.json's version (see README), so they must match
      - name: Check manifest version matches the tag
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          version=$(node -p "require('./manifest.json').version")
          if [ "$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::manifest.json version $version does not match tag $GITHUB_REF_NAME"
            exit 1
          fi

  # The community plugin directory recommends artifact attestations for release assets, so releases are
  # made here, where the files can be attested, not by hand. There is no build: the attested files are
  # the ones committed at the tag. The release is a draft so the notes can be written before it goes out
  release:
    needs: test
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write # create the release
      id-token: write # Sigstore signing certificate for the attestation
      attestations: write
      artifact-metadata: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: |
            main.js
            manifest.json
            styles.css

      - name: Create draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" main.js manifest.json styles.css --draft --title "$GITHUB_REF_NAME" --generate-notes
